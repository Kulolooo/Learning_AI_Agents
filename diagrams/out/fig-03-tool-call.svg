<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img">
<rect width="1120" height="660" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif;}</style>
<text x="40.0" y="44.0" font-size="23.0" fill="#0f172a" text-anchor="start" font-weight="700" dominant-baseline="middle">图 3-1  一次工具调用的完整时序</text>
<text x="40.0" y="70.0" font-size="14.0" fill="#475569" text-anchor="start" dominant-baseline="middle">模型的输出只是「意图」；真正的执行发生在运行时，且每一步都可能失败</text>
<rect x="20.0" y="100.0" width="220.0" height="52.0" rx="10.0" fill="#f8fafc" fill-opacity="1.0" stroke="#cbd5e1" stroke-width="2.0"/>
<text x="130.0" y="132.0" font-size="15.0" fill="#0f172a" text-anchor="middle" font-weight="700" dominant-baseline="middle">用户 / 上游</text>
<line x1="130.0" y1="152.0" x2="130.0" y2="600.0" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="280.0" y="100.0" width="220.0" height="52.0" rx="10.0" fill="#eef2ff" fill-opacity="1.0" stroke="#818cf8" stroke-width="2.0"/>
<text x="390.0" y="132.0" font-size="15.0" fill="#312e81" text-anchor="middle" font-weight="700" dominant-baseline="middle">智能体循环</text>
<line x1="390.0" y1="152.0" x2="390.0" y2="600.0" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="550.0" y="100.0" width="220.0" height="52.0" rx="10.0" fill="#fef3c7" fill-opacity="1.0" stroke="#fbbf24" stroke-width="2.0"/>
<text x="660.0" y="132.0" font-size="15.0" fill="#78350f" text-anchor="middle" font-weight="700" dominant-baseline="middle">工具注册表</text>
<line x1="660.0" y1="152.0" x2="660.0" y2="600.0" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="820.0" y="100.0" width="220.0" height="52.0" rx="10.0" fill="#dcfce7" fill-opacity="1.0" stroke="#4ade80" stroke-width="2.0"/>
<text x="930.0" y="132.0" font-size="15.0" fill="#14532d" text-anchor="middle" font-weight="700" dominant-baseline="middle">外部世界</text>
<line x1="930.0" y1="152.0" x2="930.0" y2="600.0" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="130.0" y1="170.0" x2="390.0" y2="170.0" stroke="#64748b" stroke-width="2.0"/>
<polygon points="390.0,170.0 379.0,176.0 379.0,164.0" fill="#64748b"/>
<text x="260.0" y="158.0" font-size="12.0" fill="#64748b" text-anchor="middle" dominant-baseline="middle">① 提出任务</text>
<line x1="390.0" y1="225.0" x2="660.0" y2="225.0" stroke="#4f46e5" stroke-width="2.0"/>
<polygon points="660.0,225.0 649.0,231.0 649.0,219.0" fill="#4f46e5"/>
<text x="525.0" y="213.0" font-size="12.0" fill="#4f46e5" text-anchor="middle" dominant-baseline="middle">② 组装 tools schema 随请求发送</text>
<polyline points="390.0,274.0 454.0,274.0 454.0,306.0 390.0,306.0" fill="none" stroke="#4f46e5" stroke-width="2.0" stroke-linejoin="round"/>
<polygon points="390.0,306.0 401.0,300.0 401.0,312.0" fill="#4f46e5"/>
<text x="422.0" y="260.0" font-size="12.0" fill="#4f46e5" text-anchor="middle" dominant-baseline="middle">③ 模型返回 tool_call（名字 + 参数 JSON）</text>
<line x1="390.0" y1="350.0" x2="660.0" y2="350.0" stroke="#b45309" stroke-width="2.0"/>
<polygon points="660.0,350.0 649.0,356.0 649.0,344.0" fill="#b45309"/>
<text x="525.0" y="338.0" font-size="12.0" fill="#b45309" text-anchor="middle" dominant-baseline="middle">④ 参数校验：缺参 / 类型错 / 未声明字段</text>
<line x1="660.0" y1="415.0" x2="930.0" y2="415.0" stroke="#047857" stroke-width="2.0"/>
<polygon points="930.0,415.0 919.0,421.0 919.0,409.0" fill="#047857"/>
<text x="795.0" y="403.0" font-size="12.0" fill="#047857" text-anchor="middle" dominant-baseline="middle">⑤ 执行：副作用工具先过审批门</text>
<line x1="660.0" y1="480.0" x2="390.0" y2="480.0" stroke="#b45309" stroke-width="2.0"/>
<polygon points="390.0,480.0 401.0,474.0 401.0,486.0" fill="#b45309"/>
<text x="525.0" y="468.0" font-size="12.0" fill="#b45309" text-anchor="middle" dominant-baseline="middle">⑥ 结果或错误，统一转成观察文本</text>
<polyline points="390.0,529.0 454.0,529.0 454.0,561.0 390.0,561.0" fill="none" stroke="#4f46e5" stroke-width="2.0" stroke-linejoin="round"/>
<polygon points="390.0,561.0 401.0,555.0 401.0,567.0" fill="#4f46e5"/>
<text x="422.0" y="515.0" font-size="12.0" fill="#4f46e5" text-anchor="middle" dominant-baseline="middle">⑦ 观察写回消息列表，进入下一轮决策</text>
<rect x="80.0" y="610.0" width="960.0" height="34.0" rx="8.0" fill="#f8fafc" fill-opacity="1.0" stroke="#e2e8f0" stroke-width="2.0"/>
<text x="96.0" y="632.0" font-size="12.0" fill="#475569" text-anchor="start" dominant-baseline="middle">失败路径：④ 校验失败 → 结构化错误；⑤ 抛异常 / 超时 → ERROR 文本；两种情况都不终止循环，而是交给模型决策。</text>
</svg>