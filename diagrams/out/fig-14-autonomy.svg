<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" role="img">
<rect width="1120" height="680" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif;}</style>
<text x="40.0" y="44.0" font-size="23.0" fill="#0f172a" text-anchor="start" font-weight="700" dominant-baseline="middle">图 13-1  自主度与任务不确定性的取舍</text>
<text x="40.0" y="70.0" font-size="14.0" fill="#475569" text-anchor="start" dominant-baseline="middle">越往右上，能力越强、成本越高、越需要护栏</text>
<rect x="150.0" y="120.0" width="810.0" height="460.0" rx="12.0" fill="#ffffff" fill-opacity="1.0" stroke="#cbd5e1" stroke-width="2.0"/>
<line x1="555.0" y1="120.0" x2="555.0" y2="580.0" stroke="#e2e8f0" stroke-width="2.0"/>
<line x1="150.0" y1="350.0" x2="960.0" y2="350.0" stroke="#e2e8f0" stroke-width="2.0"/>
<text x="555.0" y="616.0" font-size="13.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">任务不确定性 →</text>
<text x="124.0" y="328.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">自</text>
<text x="124.0" y="348.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">主</text>
<text x="124.0" y="368.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">度</text>
<text x="124.0" y="142.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">高</text>
<text x="124.0" y="560.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">低</text>
<rect x="175.0" y="165.0" width="240.0" height="84.0" rx="12.0" fill="#fef3c7" fill-opacity="1.0" stroke="#fbbf24" stroke-width="2.0"/>
<text x="295.0" y="198.0" font-size="16.0" fill="#78350f" text-anchor="middle" font-weight="700" dominant-baseline="middle">ReAct 循环</text>
<text x="295.0" y="220.0" font-size="12.5" fill="#475569" text-anchor="middle" dominant-baseline="middle">高自主 · 中不确定</text>
<rect x="610.0" y="165.0" width="240.0" height="84.0" rx="12.0" fill="#ffe4e6" fill-opacity="1.0" stroke="#fb7185" stroke-width="2.0"/>
<text x="730.0" y="198.0" font-size="16.0" fill="#881337" text-anchor="middle" font-weight="700" dominant-baseline="middle">多智能体</text>
<text x="730.0" y="220.0" font-size="12.5" fill="#475569" text-anchor="middle" dominant-baseline="middle">高自主 · 高不确定</text>
<rect x="175.0" y="400.0" width="240.0" height="84.0" rx="12.0" fill="#dcfce7" fill-opacity="1.0" stroke="#4ade80" stroke-width="2.0"/>
<text x="295.0" y="433.0" font-size="16.0" fill="#14532d" text-anchor="middle" font-weight="700" dominant-baseline="middle">固定工作流</text>
<text x="295.0" y="455.0" font-size="12.5" fill="#475569" text-anchor="middle" dominant-baseline="middle">低自主 · 低不确定</text>
<rect x="610.0" y="400.0" width="240.0" height="84.0" rx="12.0" fill="#e0f2fe" fill-opacity="1.0" stroke="#38bdf8" stroke-width="2.0"/>
<text x="730.0" y="433.0" font-size="16.0" fill="#0c4a6e" text-anchor="middle" font-weight="700" dominant-baseline="middle">路由 + 模板</text>
<text x="730.0" y="455.0" font-size="12.5" fill="#475569" text-anchor="middle" dominant-baseline="middle">低自主 · 中不确定</text>
<text x="175.0" y="292.0" font-size="12.0" fill="#475569" text-anchor="start" dominant-baseline="middle">工具充分时最优：失败可回灌。</text>
<text x="610.0" y="292.0" font-size="12.0" fill="#475569" text-anchor="start" dominant-baseline="middle">仅当角色确实异质、且能承担通信成本。</text>
<text x="175.0" y="530.0" font-size="12.0" fill="#475569" text-anchor="start" dominant-baseline="middle">确定性优先：可预测、可审计、延迟最低。</text>
<text x="610.0" y="530.0" font-size="12.0" fill="#475569" text-anchor="start" dominant-baseline="middle">分类清晰时最优：意图可枚举。</text>
<text x="70.0" y="640.0" font-size="13.0" fill="#0f172a" text-anchor="start" dominant-baseline="middle">选择顺序：能工作流就工作流 → 能路由就路由 → 单智能体 → 多智能体。每升一级，先补齐对应的评估与护栏。</text>
</svg>