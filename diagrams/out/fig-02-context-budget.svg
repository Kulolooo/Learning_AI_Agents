<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img">
<rect width="1120" height="620" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif;}</style>
<text x="40.0" y="44.0" font-size="23.0" fill="#0f172a" text-anchor="start" font-weight="700" dominant-baseline="middle">图 2-1  上下文预算的分配与压缩</text>
<text x="40.0" y="70.0" font-size="14.0" fill="#475569" text-anchor="start" dominant-baseline="middle">把 128k 的窗口当成一张预算表：谁占位、谁可压缩、压缩后损失什么</text>
<rect x="80.0" y="150.0" width="134.4" height="86.0" rx="4.0" fill="#c7d2fe" fill-opacity="1.0" stroke="#ffffff" stroke-width="2.0"/>
<text x="147.2" y="198.0" font-size="15.0" fill="#0f172a" text-anchor="middle" font-weight="700" dominant-baseline="middle">系统提示</text>
<text x="147.2" y="260.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">14%</text>
<rect x="214.4" y="150.0" width="105.6" height="86.0" rx="4.0" fill="#bae6fd" fill-opacity="1.0" stroke="#ffffff" stroke-width="2.0"/>
<text x="267.2" y="198.0" font-size="15.0" fill="#0f172a" text-anchor="middle" font-weight="700" dominant-baseline="middle">工具说明</text>
<text x="267.2" y="260.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">11%</text>
<rect x="320.0" y="150.0" width="144.0" height="86.0" rx="4.0" fill="#ddd6fe" fill-opacity="1.0" stroke="#ffffff" stroke-width="2.0"/>
<text x="392.0" y="198.0" font-size="15.0" fill="#0f172a" text-anchor="middle" font-weight="700" dominant-baseline="middle">长期记忆</text>
<text x="392.0" y="260.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">15%</text>
<rect x="464.0" y="150.0" width="268.8" height="86.0" rx="4.0" fill="#fde68a" fill-opacity="1.0" stroke="#ffffff" stroke-width="2.0"/>
<text x="598.4" y="198.0" font-size="15.0" fill="#0f172a" text-anchor="middle" font-weight="700" dominant-baseline="middle">历史对话</text>
<text x="598.4" y="260.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">28%</text>
<rect x="732.8" y="150.0" width="86.4" height="86.0" rx="4.0" fill="#bbf7d0" fill-opacity="1.0" stroke="#ffffff" stroke-width="2.0"/>
<text x="776.0" y="198.0" font-size="15.0" fill="#0f172a" text-anchor="middle" font-weight="700" dominant-baseline="middle">当前任务</text>
<text x="776.0" y="260.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">9%</text>
<rect x="819.2" y="150.0" width="220.8" height="86.0" rx="4.0" fill="#fecdd3" fill-opacity="1.0" stroke="#ffffff" stroke-width="2.0"/>
<text x="929.6" y="198.0" font-size="15.0" fill="#0f172a" text-anchor="middle" font-weight="700" dominant-baseline="middle">预留输出</text>
<text x="929.6" y="260.0" font-size="12.0" fill="#475569" text-anchor="middle" dominant-baseline="middle">23%</text>
<text x="80.0" y="132.0" font-size="13.0" fill="#475569" text-anchor="start" dominant-baseline="middle">128k 上下文窗口（示意比例）</text>
<rect x="80.0" y="300.0" width="460.0" height="250.0" rx="14.0" fill="#ffffff" fill-opacity="0.55" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="96.0" y="326.0" font-size="14.0" fill="#0f172a" text-anchor="start" font-weight="700" dominant-baseline="middle">可压缩区：按代价从低到高</text>
<rect x="105.0" y="340.0" width="410.0" height="44.0" rx="8.0" fill="#dcfce7" fill-opacity="1.0" stroke="#4ade80" stroke-width="2.0"/>
<text x="120.0" y="368.0" font-size="14.0" fill="#14532d" text-anchor="start" font-weight="700" dominant-baseline="middle">① 截断旧对话</text>
<text x="290.0" y="368.0" font-size="12.0" fill="#475569" text-anchor="start" dominant-baseline="middle">零成本，丢细节</text>
<rect x="105.0" y="390.0" width="410.0" height="44.0" rx="8.0" fill="#dcfce7" fill-opacity="1.0" stroke="#4ade80" stroke-width="2.0"/>
<text x="120.0" y="418.0" font-size="14.0" fill="#14532d" text-anchor="start" font-weight="700" dominant-baseline="middle">② 工具输出摘要</text>
<text x="290.0" y="418.0" font-size="12.0" fill="#475569" text-anchor="start" dominant-baseline="middle">一次小模型调用</text>
<rect x="105.0" y="440.0" width="410.0" height="44.0" rx="8.0" fill="#fef3c7" fill-opacity="1.0" stroke="#fbbf24" stroke-width="2.0"/>
<text x="120.0" y="468.0" font-size="14.0" fill="#78350f" text-anchor="start" font-weight="700" dominant-baseline="middle">③ 历史滚动摘要</text>
<text x="290.0" y="468.0" font-size="12.0" fill="#475569" text-anchor="start" dominant-baseline="middle">需要重写，可能丢数字</text>
<rect x="105.0" y="490.0" width="410.0" height="44.0" rx="8.0" fill="#ffe4e6" fill-opacity="1.0" stroke="#fb7185" stroke-width="2.0"/>
<text x="120.0" y="518.0" font-size="14.0" fill="#881337" text-anchor="start" font-weight="700" dominant-baseline="middle">④ 检索替代全量</text>
<text x="290.0" y="518.0" font-size="12.0" fill="#475569" text-anchor="start" dominant-baseline="middle">引入召回失败风险</text>
<rect x="580.0" y="300.0" width="460.0" height="250.0" rx="14.0" fill="#ffffff" fill-opacity="0.55" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="596.0" y="326.0" font-size="14.0" fill="#0f172a" text-anchor="start" font-weight="700" dominant-baseline="middle">不可压缩区：必须预留</text>
<text x="605.0" y="348.0" font-size="12.5" fill="#475569" text-anchor="start" dominant-baseline="middle">输出预留：模型答复本身也要占窗口。把上限写进 Budget，比事后截断</text>
<text x="605.0" y="366.5" font-size="12.5" fill="#475569" text-anchor="start" dominant-baseline="middle">安全。</text>
<text x="605.0" y="412.0" font-size="12.5" fill="#475569" text-anchor="start" dominant-baseline="middle">工具 schema：可精简描述，但不能删参数约束——删掉等于把校验责任</text>
<text x="605.0" y="430.5" font-size="12.5" fill="#475569" text-anchor="start" dominant-baseline="middle">交给模型。</text>
<text x="605.0" y="476.0" font-size="12.5" fill="#475569" text-anchor="start" dominant-baseline="middle">系统提示：稳定规则应前置且少改，改一次前缀缓存全失效。</text>
<text x="80.0" y="590.0" font-size="13.0" fill="#475569" text-anchor="start" dominant-baseline="middle">经验值：历史对话超过窗口的 30% 时，回答质量开始明显下降；此时应触发摘要而不是继续追加。</text>
</svg>