<text x="75.0" y="525.0" font-size="13.0" fill="#475569" text-anchor="start" dominant-baseline="middle">检查点 = 完整状态快照（消息、计划、工具结果、预算计数）+ 版本号。有了它，中断可恢复、失败可重放、评测可复现。</text>
<text x="75.0" y="567.0" font-size="12.0" fill="#475569" text-anchor="start" dominant-baseline="middle">代价：状态必须可序列化——把数据库连接、文件句柄这类东西挡在状态之外。</text>
