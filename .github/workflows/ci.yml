name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 单元测试
        run: python -m unittest discover -s tests -v
      - name: 示例脚本
        run: |
          python -m learning_agents.demo
          python examples/01_hello_agent.py
          python examples/06_evaluate.py
      - name: 文档自检
        run: python tools/check_links.py
      - name: 文风审计
        run: python tools/style_audit.py
